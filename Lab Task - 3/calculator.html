<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
    
    
        .calculator {
          background-color: #653030;
          padding: 15px;
          border-radius: 8px;
          width: 35%;
          margin: 0 auto;
        }
    
        input {
          width: 100%;
          font-size: 24px;
          text-align: right;
          padding: 8px;
          margin-bottom: 10px;
          box-sizing: border-box;
        }
    
        button {
          width: 60px;
          height: 60px;
          font-size: 20px;
          margin: 4px;
          cursor: pointer;
        }
      </style>
</head>
<body>
    <div class="calculator">

        <input type="text" id="display" value="0" readonly />
    
        <div>
          <button>7</button>
          <button>8</button>
          <button>9</button>
          <button>+</button>
        </div>
    
        <div>
          <button>4</button>
          <button>5</button>
          <button>6</button>
          <button>-</button>
        </div>
    
        <div>
          <button>1</button>
          <button>2</button>
          <button>3</button>
          <button>*</button>
        </div>
    
        <div>
          <button>0</button>
          <button>C</button>
          <button>=</button>
          <button>/</button>
        </div>
    
      </div>
</body>
</html>
